config.php : contient la connexion à la base de données avec la variable $bdd pour toutes les requêtes, ça permet d’accéder facilement à la table SQL.

index.php : page principale qui permet :

d'ajouter un résultat,

de chercher dans les résultats,

de trier les colonnes ascendant ou descendant,

de modifier via edit.php et de supprimer directement un résultat.
Variables principales : $erreurs, $courses, $tri, $ordre, $mot, $resultats.
La fonction lien_tri() sert à générer les liens de tri avec les flèches.

edit.php : page pour modifier un résultat.

Récupère l'ID du résultat,

affiche un formulaire pré-rempli,

vérifie que le pays fait 3 lettres maximum et que le temps est un nombre et pas un texte.
Permet aussi de supprimer le résultat depuis cette page pour éviter les doublons.
Variables principales : $donnees, $erreurs.

J'ai préféré séparer le projet en trois fichiers plutôt que de tout mettre dans un seul pour que ce soit plus clair et plus facile à gérer.

J'avais déjà avancé un peu sur la diapo quand je suis rentré chez moi, donc j'ai pu le faire assez facilement, même si pour moi c'est encore flou et compliqué par moments. Parfois, j'ai dû utiliser une IA pour m'aider à déboguer mon code car le temps pour réaliser ce mini-projet était assez court.
J'ai quand même globalement réussi à faire fonctionner mon code et à respecter les consignes.

Merci beaucoup d'avoir lu.